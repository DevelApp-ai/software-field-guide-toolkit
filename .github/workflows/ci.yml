name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build, test, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'

      - name: Restore
        run: dotnet restore Sfg.Toolkit.sln

      - name: Build
        run: dotnet build Sfg.Toolkit.sln -c Release --no-restore

      - name: Test
        run: dotnet test Sfg.Toolkit.sln -c Release --no-build

      - name: Pack tool
        run: dotnet pack src/sfg -c Release -o packages --no-build

      - uses: actions/upload-artifact@v4
        with:
          name: sfg-tool-package
          path: packages/*.nupkg
          if-no-files-found: error

  demo:
    name: demo on ErpLight and RuntimePluggableClassFactory
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'

      - uses: actions/download-artifact@v4
        with:
          name: sfg-tool-package
          path: packages

      - name: Install sfg tool
        run: |
          dotnet tool install Sfg.Tool --tool-path .tools --add-source packages
          ./.tools/sfg --version

      - name: Fetch example codebases
        run: |
          curl -sL https://codeload.github.com/DevelApp-ai/ErpLight/tar.gz/refs/heads/main | tar xz
          curl -sL https://codeload.github.com/DevelApp-ai/RuntimePluggableClassFactory/tar.gz/refs/heads/main | tar xz

      - name: Run context-map on both examples
        run: |
          ./.tools/sfg context-map ErpLight-main --out demo/erplight/context-map
          ./.tools/sfg context-map RuntimePluggableClassFactory-main --out demo/rpcf/context-map

      - name: Run seam-ledger on both examples
        run: |
          ./.tools/sfg seam-ledger ErpLight-main --out demo/erplight/seam-ledger
          ./.tools/sfg seam-ledger RuntimePluggableClassFactory-main --out demo/rpcf/seam-ledger

      - name: Assert non-empty, cited, deterministic outputs
        run: |
          set -eu
          for repo in erplight rpcf; do
            for f in demo/$repo/context-map/context-map.drawio \
                     demo/$repo/context-map/context-map.json \
                     demo/$repo/context-map/findings.md \
                     demo/$repo/seam-ledger/seam-ledger.json \
                     demo/$repo/seam-ledger/collapse-review.md; do
              test -s "$f" || { echo "MISSING OR EMPTY: $f"; exit 1; }
            done
            # every finding must carry a file:line citation
            grep -qE ':[0-9]+`' demo/$repo/context-map/findings.md
            # seam ledger must be non-trivial JSON
            test "$(jq '.seams | length' demo/$repo/seam-ledger/seam-ledger.json)" -gt 0
          done

          # determinism: same input, byte-identical artifacts
          ./.tools/sfg context-map ErpLight-main --out /tmp/rerun
          cmp demo/erplight/context-map/context-map.drawio /tmp/rerun/context-map.drawio
          cmp demo/erplight/context-map/context-map.json /tmp/rerun/context-map.json
          cmp demo/erplight/context-map/findings.md /tmp/rerun/findings.md

      - uses: actions/upload-artifact@v4
        with:
          name: sfg-demo-output
          path: demo
          if-no-files-found: error

  demo-multitenant:
    name: tenant probes bite on the multitenant demo
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'

      - uses: actions/download-artifact@v4
        with:
          name: sfg-tool-package
          path: packages

      - name: Install sfg tool
        run: |
          dotnet tool install Sfg.Tool --tool-path .tools --add-source packages
          ./.tools/sfg --version

      # probes-good/, probes-rerun/, probes-nofilter/, probes-noguard/ are generated
      # output and never committed; the manifest.json is uploaded as the artifact.
      - name: Generate probes for the good app and run them green
        run: |
          ./.tools/sfg tenant-probes demo/MultitenantApp --out probes-good
          dotnet test probes-good/TenantProbes.csproj

      - name: Determinism - regenerate and compare byte-identical
        run: |
          ./.tools/sfg tenant-probes demo/MultitenantApp --out probes-rerun
          for f in TenantProbes.csproj ProbeHarness.cs CrossTenantReadProbes.cs SaveGuardProbes.cs PoolCheckoutProbes.cs DisabledStateFailClosedProbes.cs manifest.json README.md; do
            cmp "probes-good/$f" "probes-rerun/$f"
          done

      - name: Probes bite on the broken query filter
        run: |
          cp -r demo/MultitenantApp /tmp/app-nofilter
          cp demo/broken/AppDbContext.NoFilter.cs /tmp/app-nofilter/AppDbContext.cs
          ./.tools/sfg tenant-probes /tmp/app-nofilter --out probes-nofilter
          set +e
          dotnet test probes-nofilter/TenantProbes.csproj > nofilter.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PROBES DID NOT BITE: suite stayed green with the query filter removed"; exit 1
          fi
          grep -q "Failed TenantProbes.CrossTenantReadProbes" nofilter.log

      - name: Probes bite on the broken save guard
        run: |
          cp -r demo/MultitenantApp /tmp/app-noguard
          cp demo/broken/AppDbContext.NoGuard.cs /tmp/app-noguard/AppDbContext.cs
          ./.tools/sfg tenant-probes /tmp/app-noguard --out probes-noguard
          set +e
          dotnet test probes-noguard/TenantProbes.csproj > noguard.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "PROBES DID NOT BITE: suite stayed green with the save guard removed"; exit 1
          fi
          grep -q "Failed TenantProbes.SaveGuardProbes" noguard.log

      - uses: actions/upload-artifact@v4
        with:
          name: sfg-tenant-probes-manifest
          path: probes-good/manifest.json
          if-no-files-found: error
  demo-cockpit:
    name: cockpit bites on the strangler-fig demo
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'

      - uses: actions/download-artifact@v4
        with:
          name: sfg-tool-package
          path: packages

      - name: Install sfg tool
        run: |
          dotnet tool install Sfg.Tool --tool-path .tools --add-source packages
          ./.tools/sfg --version

      # cockpit-good/, cockpit-rerun/, cockpit-unwired/, cockpit-lying/, cockpit-drifted/
      # are generated output and never committed; the cockpit board is uploaded as the artifact.
      - name: Generate cockpit for the good app and run the shadow suite green
        run: |
          ./.tools/sfg cockpit demo/StranglerApp --out cockpit-good
          dotnet test cockpit-good/ShadowDiff.csproj

      - name: Assert the tripwire fires with cited evidence
        run: |
          set -eu
          test -s cockpit-good/cockpit.md
          grep -q "sunset window open" cockpit-good/cockpit.md
          grep -q "shipping.quote" cockpit-good/cockpit.md
          grep -qE ':[0-9]+`' cockpit-good/cockpit.md

      - name: Determinism - regenerate and compare byte-identical
        run: |
          ./.tools/sfg cockpit demo/StranglerApp --out cockpit-rerun
          for f in cockpit.md cockpit.json cockpit.drawio ShadowDiff.csproj ShadowDiffHarness.cs RouteShadowProbes.cs Cases.cs manifest.json README.md; do
            cmp "cockpit-good/$f" "cockpit-rerun/$f"
          done

      - name: Cockpit rejects the unwired declared route
        run: |
          set +e
          ./.tools/sfg cockpit demo/StranglerApp --config demo/broken/migration.UnwiredRoute.json --out cockpit-unwired --strict > unwired.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "COCKPIT DID NOT BITE: the unwired declared route passed"; exit 1
          fi
          grep -q "migration/unwired-route" cockpit-unwired/cockpit.md
          grep -q "promo.code" cockpit-unwired/cockpit.md

      - name: Cockpit rejects the lying strangled route
        run: |
          set +e
          ./.tools/sfg cockpit demo/StranglerApp --config demo/broken/migration.LyingStrangled.json --out cockpit-lying --strict > lying.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "COCKPIT DID NOT BITE: the lying strangled route passed"; exit 1
          fi
          grep -q "migration/strangle-unfinished" cockpit-lying/cockpit.md
          grep -q "shipping.quote" cockpit-lying/cockpit.md

      - name: Shadow diff bites on the drifted implementation
        run: |
          cp -r demo/StranglerApp /tmp/app-drifted
          cp demo/broken/OrdersSearchService.Drifted.cs /tmp/app-drifted/OrdersSearchService.cs
          ./.tools/sfg cockpit /tmp/app-drifted --out cockpit-drifted
          set +e
          dotnet test cockpit-drifted/ShadowDiff.csproj > drifted.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "SHADOW DID NOT BITE: the drifted implementation stayed green"; exit 1
          fi
          grep -q "SHADOW DRIFT" drifted.log
          grep -q "orders.search" drifted.log

      - uses: actions/upload-artifact@v4
        with:
          name: sfg-cockpit-board
          path: cockpit-good/
          if-no-files-found: error
  demo-events:
    name: events harness bites on the eventing demo
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.4xx'

      - uses: actions/download-artifact@v4
        with:
          name: sfg-tool-package
          path: packages

      - name: Install sfg tool
        run: |
          dotnet tool install Sfg.Tool --tool-path .tools --add-source packages
          ./.tools/sfg --version

      # events-good/, events-rerun/, events-naive/, events-fireandforget/
      # are generated output and never committed; the manifest is uploaded as the artifact.
      - name: Generate the conformance suite for the good app and run it green
        run: |
          ./.tools/sfg events demo/EventApp --out events-good
          dotnet test events-good/EventConformance.csproj

      - name: Assert the board is cited and complete
        run: |
          set -eu
          test -s events-good/events.md
          grep -q "order.placed" events-good/events.md
          grep -q "invoice.issued" events-good/events.md
          grep -qE ':[0-9]+`' events-good/events.md

      - name: Determinism - regenerate and compare byte-identical
        run: |
          ./.tools/sfg events demo/EventApp --out events-rerun
          for f in events.md events.json EventConformance.csproj EventConformanceHarness.cs ConsumerProbes.cs OutboxProbes.cs Cases.cs manifest.json README.md; do
            cmp "events-good/$f" "events-rerun/$f"
          done

      - name: Conformance bites on the naive consumer
        run: |
          cp -r demo/EventApp /tmp/app-naive
          cp demo/broken/OrderEventsConsumer.Naive.cs /tmp/app-naive/OrderEventsConsumer.cs
          ./.tools/sfg events /tmp/app-naive --out events-naive
          set +e
          dotnet test events-naive/EventConformance.csproj > naive.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "HARNESS DID NOT BITE: the naive consumer passed the conformance suite"; exit 1
          fi
          grep -q "Failed EventConformance.ConsumerProbes" naive.log

      - name: Outbox probes bite on the fire-and-forget outbox
        run: |
          cp -r demo/EventApp /tmp/app-fireandforget
          cp demo/broken/Outbox.FireAndForget.cs /tmp/app-fireandforget/Outbox.cs
          ./.tools/sfg events /tmp/app-fireandforget --out events-fireandforget
          set +e
          dotnet test events-fireandforget/EventConformance.csproj > fireandforget.log 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "HARNESS DID NOT BITE: the fire-and-forget outbox passed the conformance suite"; exit 1
          fi
          grep -q "Failed EventConformance.OutboxProbes" fireandforget.log

      - uses: actions/upload-artifact@v4
        with:
          name: sfg-events-manifest
          path: events-good/manifest.json
          if-no-files-found: error
